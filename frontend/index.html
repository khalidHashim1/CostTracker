<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Weekly Cost Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background: #f4f6f8;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            flex: 1;
            min-width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h3 {
            margin: 10px 0 5px;
            font-weight: 500;
            color: #34495e;
        }
        .card p {
            font-size: 1.5em;
            font-weight: 700;
            margin: 0;
        }
        .charts {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            min-width: 400px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #34495e;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>AWS Weekly Cost Dashboard</h1>
    </header>

    <div class="container">
        <!-- Summary Cards -->
        <div class="cards">
            <div class="card">
                <h3>Total This Week</h3>
                <p id="total-week">$0</p>
            </div>
            <div class="card">
                <h3>Categories</h3>
                <p id="categories-count">0</p>
            </div>
            <div class="card">
                <h3>Change vs Last Week </h3>
                <p id="change-week">0%</p>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts">
            <div class="chart-container">
                <h2>Weekly Spendings Trend</h2>
                <canvas id="weeklyTrendChart"></canvas>
            </div>
            <div class="chart-container">
                <h2>Spendings by Category</h2>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>

    <script>
fetch("aws_cost_dashboard.json?ts=" + Date.now())
  .then(res => res.json())
  .then(data => {
    if (!data || data.length === 0) return;

    // Use the last day as "this week" and first day as "last week"
    const latestDay = data[data.length - 1];
    const firstDay = data[0];

    const categorySpendings = latestDay.categories;
    const thisWeekTotal = latestDay.total;
    const lastWeekTotal = firstDay.total;

    // Update summary cards
    document.getElementById('total-week').textContent = `$${thisWeekTotal.toFixed(2)}`;
    document.getElementById('categories-count').textContent = Object.keys(categorySpendings).length;
    const changePercent = lastWeekTotal === 0 
      ? "0%" 
      : (((thisWeekTotal - lastWeekTotal) / lastWeekTotal) * 100).toFixed(1) + "%";
    document.getElementById('change-week').textContent = changePercent;

    // Prepare category chart
    const labels = Object.keys(categorySpendings);
    const values = Object.values(categorySpendings);

    const ctxCategory = document.getElementById('categoryChart').getContext('2d');
    new Chart(ctxCategory, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Spendings ($)',
          data: values,
          backgroundColor: 'rgba(52, 152, 219, 0.7)',
          borderColor: 'rgba(52, 152, 219, 1)',
          borderWidth: 1
        }]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    // Prepare weekly trend chart
    const weeklyTrendLabels = [firstDay.date, latestDay.date];
    const weeklyTrendData = [lastWeekTotal, thisWeekTotal];

    const ctxTrend = document.getElementById('weeklyTrendChart').getContext('2d');
    new Chart(ctxTrend, {
      type: 'line',
      data: {
        labels: weeklyTrendLabels,
        datasets: [{
          label: 'Weekly Spendings ($)',
          data: weeklyTrendData,
          backgroundColor: 'rgba(46, 204, 113, 0.3)',
          borderColor: 'rgba(46, 204, 113, 1)',
          borderWidth: 3,
          fill: true,
          tension: 0.3,
          pointRadius: 5
        }]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

  })
  .catch(err => {
    console.error("Failed to load AWS JSON:", err);
  });
</script>


</body>
</html>
